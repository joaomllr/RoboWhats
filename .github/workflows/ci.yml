name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Monorepo Lint & Typecheck
        run: npm run lint

      - name: Unit Tests
        run: npm run test

      - name: Dependency Vulnerability Audit
        run: npm run audit

      - name: Build Dashboard & Functions
        run: npm run build
