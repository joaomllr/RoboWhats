name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: "https://nsotmdvalhcqrigepkcu.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_pVHNpa7nCtSmfiEloxSC1g_IWw8iqXd"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Monorepo Lint & Typecheck
        run: npm run lint

      - name: Unit & Multi-Tenant RLS Tests
        run: npm run test

      - name: Postgres RLS Isolation Tests
        run: npm run test:rules

      - name: Build Dashboard & Functions
        run: npm run build

