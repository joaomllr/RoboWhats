name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: "https://nsotmdvalhcqrigepkcu.supabase.co"
      VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_pVHNpa7nCtSmfiEloxSC1g_IWw8iqXd"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # @supabase/supabase-js 2.116+ requires Node 22+ (its realtime-js
      # dependency needs a native WebSocket global, absent on Node 20) — CI
      # was pinned to 20 and every run since at least commit 4ce6fa4 failed
      # with "Node.js detected but native WebSocket not found" the instant
      # any test called createClient().
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Monorepo Lint & Typecheck
        run: npm run lint

      - name: Unit & Multi-Tenant RLS Tests
        run: npm run test

      - name: Postgres RLS Isolation Tests
        run: npm run test:rules

      - name: Dependency Audit
        run: npm run audit

      - name: Build Dashboard & Functions
        run: npm run build

