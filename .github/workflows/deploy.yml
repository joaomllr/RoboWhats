name: Continuous Deployment

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy Edge Functions & Dashboard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Mantido em paridade com ci.yml — ver comentário lá sobre a exigência
      # de Node 22+ do @supabase/supabase-js 2.116+.
      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Build Dashboard
        env:
          VITE_SUPABASE_URL: "https://nsotmdvalhcqrigepkcu.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_pVHNpa7nCtSmfiEloxSC1g_IWw8iqXd"
        run: npm run build --workspace=apps/dashboard

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Supabase Edge Functions
        if: env.SUPABASE_ACCESS_TOKEN != ''
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy webhook --project-ref nsotmdvalhcqrigepkcu --no-verify-jwt
          supabase functions deploy onboard-tenant --project-ref nsotmdvalhcqrigepkcu
          # proactive-recovery não roda com JWT de usuário — quem a chama é um
          # cron/scheduler segurando PROACTIVE_RECOVERY_SECRET, nunca uma sessão
          # Supabase. Sem --no-verify-jwt, o CLI usa o padrão (verify_jwt: true)
          # e passaria a rejeitar até o próprio chamador legítimo.
          supabase functions deploy proactive-recovery --project-ref nsotmdvalhcqrigepkcu --no-verify-jwt

